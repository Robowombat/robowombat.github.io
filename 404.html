<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Petra Folk | UX/UI designer</title>
    <script>
      // Sends unknown paths (for example /play) back through the homepage
      // so the React app can open them. pathSegmentsToKeep is 0 because
      // the site is hosted at https://robowombat.github.io/
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
